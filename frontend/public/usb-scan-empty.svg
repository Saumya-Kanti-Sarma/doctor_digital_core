<svg width="90" height="90" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow ring -->
  <circle cx="45" cy="45" r="38" fill="#deeafb" opacity="0.6"/>
  <!-- Sparkle lines -->
  <line x1="45" y1="4" x2="45" y2="12" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="78" x2="45" y2="86" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="45" x2="12" y2="45" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="45" x2="86" y2="45" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="13" x2="19" y2="19" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="71" x2="77" y2="77" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="77" y1="13" x2="71" y2="19" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="77" x2="19" y2="71" stroke="#a8c4e8" stroke-width="2" stroke-linecap="round"/>
  <!-- USB drive body -->
  <rect x="28" y="26" width="28" height="36" rx="4" fill="#1e4db7"/>
  <rect x="34" y="18" width="16" height="12" rx="2" fill="#2563eb"/>
  <!-- USB connector prongs -->
  <rect x="37" y="14" width="4" height="6" rx="1" fill="#93b4e8"/>
  <rect x="43" y="14" width="4" height="6" rx="1" fill="#93b4e8"/>
  <!-- Drive detail lines -->
  <rect x="33" y="34" width="18" height="3" rx="1.5" fill="#4a7fd4"/>
  <rect x="33" y="40" width="12" height="3" rx="1.5" fill="#4a7fd4"/>
  <!-- Magnifier -->
  <circle cx="58" cy="58" r="12" fill="white" stroke="#1e4db7" stroke-width="3"/>
  <circle cx="58" cy="58" r="7" fill="#deeafb"/>
  <line x1="67" y1="67" x2="74" y2="74" stroke="#1e4db7" stroke-width="3.5" stroke-linecap="round"/>
</svg>
